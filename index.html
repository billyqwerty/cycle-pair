<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
/* Layout concept: рабочий журнал на двоих. Спокойная сине-зелёная бумага, цвет закреплён только за слоями цикла
   (месячные, овуляция, фертильное окно, ПМС), чтобы легенда читалась с первого взгляда. Крупные числа набраны шрифтом с засечками. */
:root {
  --bg: #EDF1EE;
  --surface: #F8FAF8;
  --surface-2: #E3E9E5;
  --ink: #17201C;
  --ink-2: #394841;
  --muted: #5A6962;
  --line: #C7D1CB;
  --line-soft: #DAE1DC;
  --btn: #17201C;
  --on-btn: #F3F7F4;
  --focus: #1F5FD1;

  --period: #B8344F;
  --on-period: #FFFFFF;
  --period-soft: #F2D6DC;
  --fertile: #15806A;
  --fertile-soft: #D3ECE4;
  --ovul: #C98A00;
  --on-ovul: #1E1500;
  --ovul-soft: #F5E5B8;
  --pms: #6C4FA6;
  --pms-soft: #E4DCF2;

  --danger: #B3261E;
  --ok: #15806A;
  --sev1: #766800;
  --sev2: #A85800;
  --sev3: #B3341C;
  --sev4: #7A0F26;
  --on-sev: #FFFFFF;

  --font-display: 'Literata', Georgia, 'Times New Roman', serif;
  --font-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512;
    --surface: #161F1B;
    --surface-2: #202B26;
    --ink: #E6EDE8;
    --ink-2: #C1CEC7;
    --muted: #96A79F;
    --line: #33433C;
    --line-soft: #25312B;
    --btn: #E6EDE8;
    --on-btn: #0E1512;
    --focus: #7BA9FF;
    --period: #E5617D;
    --on-period: #1B0A0F;
    --period-soft: #3C202A;
    --fertile: #4CC3A0;
    --fertile-soft: #17382F;
    --ovul: #F0B93A;
    --on-ovul: #1F1600;
    --ovul-soft: #3B3011;
    --pms: #AB8FE2;
    --pms-soft: #2C2544;
    --danger: #FF8E85;
    --ok: #4CC3A0;
    --sev1: #D9C74B;
    --sev2: #F29A44;
    --sev3: #FF8161;
    --sev4: #FF6283;
    --on-sev: #170B07;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512;
  --surface: #161F1B;
  --surface-2: #202B26;
  --ink: #E6EDE8;
  --ink-2: #C1CEC7;
  --muted: #96A79F;
  --line: #33433C;
  --line-soft: #25312B;
  --btn: #E6EDE8;
  --on-btn: #0E1512;
  --focus: #7BA9FF;
  --period: #E5617D;
  --on-period: #1B0A0F;
  --period-soft: #3C202A;
  --fertile: #4CC3A0;
  --fertile-soft: #17382F;
  --ovul: #F0B93A;
  --on-ovul: #1F1600;
  --ovul-soft: #3B3011;
  --pms: #AB8FE2;
  --pms-soft: #2C2544;
  --danger: #FF8E85;
  --ok: #4CC3A0;
  --sev1: #D9C74B;
  --sev2: #F29A44;
  --sev3: #FF8161;
  --sev4: #FF6283;
  --on-sev: #170B07;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; }
.display { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
.eyebrow { font: 500 11px/1.3 var(--font-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nums { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  padding-top: 12px; padding-bottom: 4px;
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand-name { font: 600 21px/1 var(--font-display); letter-spacing: -0.02em; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--muted); }
.who img { width: 26px; height: 26px; border-radius: 50%; flex: none; }
.who .nm { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
#status { font: 500 11px var(--font-mono); color: var(--muted); min-width: 0; }
.main { padding-top: 20px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--ovul-soft); color: var(--ink); font-size: 13px; border: 1px solid var(--ovul); }
.banner.err { background: var(--period-soft); border-color: var(--period); }

/* ---------- controls ---------- */
.btn {
  min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.btn-primary:hover { background: var(--btn); filter: brightness(1.18); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn-sm { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn-quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn:focus-visible, .chip:focus-visible, .day:focus-visible, .tb:focus-visible, .sc:focus-visible,
input:focus-visible, textarea:focus-visible, select:focus-visible, .switch:focus-visible, .thumb:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 36px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.on::before { content: "\2713\00a0"; }
.chip-x { padding-right: 8px; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font: 500 11px/1.5 var(--font-mono);
  letter-spacing: 0.03em; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.tag-share { background: var(--fertile-soft); border-color: var(--fertile); color: var(--ink); }
.tag-priv { color: var(--muted); }
.tag-ph-M { background: var(--period-soft); border-color: var(--period); color: var(--ink); }
.tag-ph-F { background: var(--surface-2); }
.tag-ph-O { background: var(--ovul-soft); border-color: var(--ovul); color: var(--ink); }
.tag-ph-L { background: var(--pms-soft); border-color: var(--pms); color: var(--ink); }

.inp, .sel, .ta {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.ta { min-height: 76px; resize: vertical; line-height: 1.45; }
.inp.num { max-width: 160px; font-variant-numeric: tabular-nums; }
label.lbl { display: block; font-weight: 500; margin-bottom: 6px; }
.help { font-size: 13px; color: var(--muted); margin-top: 4px; }

.switch {
  flex: none; width: 46px; height: 28px; padding: 0; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); position: relative; cursor: pointer;
}
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"] .knob { transform: translateX(18px); background: var(--bg); }
.swrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.swrow:first-child { border-top: 0; padding-top: 0; }
.swtext { min-width: 0; }
.swtext b { font-weight: 500; display: block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 100%; }
.seg button { border: 0; background: none; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.stepper input { width: 72px; text-align: center; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.stepper .suffix { color: var(--muted); font-size: 14px; }
.frow { padding: 14px 0; border-top: 1px solid var(--line-soft); display: grid; gap: 4px; }
.frow:first-of-type { border-top: 0; padding-top: 0; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card h2 { font: 600 20px/1.2 var(--font-display); letter-spacing: -0.01em; }
.card > .lead { color: var(--muted); }
.lead { color: var(--muted); max-width: 62ch; }

.hello { display: grid; gap: 14px; max-width: 760px; padding-top: 8px; }
.hello h1 { font: 600 clamp(28px, 6vw, 40px)/1.1 var(--font-display); letter-spacing: -0.02em; }
.role-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.role-card { text-align: left; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; gap: 6px; }
.role-card:hover { border-color: var(--ink); }
.role-card b { font: 600 20px var(--font-display); }
.role-card span { color: var(--muted); font-size: 14px; }
.skeleton { height: 120px; border-radius: 16px; background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------- hero ---------- */
.hero { display: grid; gap: 18px 28px; grid-template-columns: auto minmax(0, 1fr); align-items: center; padding: 4px 0 2px; }
.hero-num { display: flex; align-items: baseline; gap: 10px; }
.hero-num .num { font: 600 clamp(64px, 16vw, 92px)/0.9 var(--font-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.hero-num .unit { font: 500 11px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); max-width: 8ch; }
.hero-side { display: grid; gap: 10px; min-width: 0; }
.hero-phase { font: italic 500 clamp(22px, 5vw, 30px)/1.15 var(--font-display); }
.hero-hint { color: var(--muted); font-size: 14px; max-width: 52ch; }
@media (max-width: 640px) { .hero { grid-template-columns: minmax(0, 1fr); } }

.ribbon-wrap { display: grid; gap: 6px; padding-top: 6px; }
.ribbon { position: relative; display: flex; gap: 2px; height: 34px; }
.seg-p { flex-basis: 0; min-width: 0; display: flex; align-items: center; padding: 0 8px; font: 500 11px var(--font-mono); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.seg-p:first-child { border-radius: 10px 4px 4px 10px; }
.seg-p:last-child { border-radius: 4px 10px 10px 4px; }
.seg-M { background: var(--period); color: var(--on-period); }
.seg-F { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.seg-O { background: var(--ovul); color: var(--on-ovul); justify-content: center; padding: 0; }
.seg-L { background: var(--pms-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--pms); }
.ribbon-now { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 2px var(--bg); }
.ribbon-fw { position: relative; height: 6px; border-radius: 3px; background: var(--line-soft); }
.ribbon-fw i { position: absolute; top: 0; bottom: 0; background: var(--fertile); border-radius: 3px; }
.ribbon-cap { display: flex; justify-content: space-between; gap: 8px; font: 500 11px var(--font-mono); color: var(--muted); }
.alert { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--period); background: var(--period-soft); display: grid; gap: 8px; }
.alert b { font-weight: 600; }

/* ---------- upcoming ---------- */
.up-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.up { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: grid; gap: 4px; align-content: start; border-top-width: 4px; }
.up-period { border-top-color: var(--period); }
.up-ov { border-top-color: var(--ovul); }
.up-fw { border-top-color: var(--fertile); }
.up-pms { border-top-color: var(--pms); }
.up .big { font: 600 18px/1.2 var(--font-display); }
.up .rel { font-size: 13px; color: var(--muted); }

/* ---------- calendar ---------- */
.cal-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.col-a, .col-b { display: contents; }
.col-a > .calcard { order: 1; }
.col-b > .daypanel { order: 2; }
.col-b > .upcard { order: 3; }
.col-a > .legend { order: 4; }
@media (min-width: 900px) {
  .cal-layout { grid-template-columns: minmax(0, 540px) minmax(0, 1fr); align-items: start; }
  .col-a, .col-b { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .col-a > *, .col-b > * { order: 0 !important; }
}
.calhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.calhead h2 { text-transform: capitalize; }
.calnav { display: flex; gap: 6px; }
.calnav .btn { min-width: 40px; padding-inline: 10px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font: 500 11px var(--font-mono); color: var(--muted); text-align: center; padding: 2px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
.day {
  position: relative; display: grid; place-items: center; aspect-ratio: 1; padding: 0; min-width: 0;
  border: 1px solid var(--line-soft); border-radius: 10px; background: var(--bg);
  color: var(--ink); font: 500 14px var(--font-body); cursor: pointer; overflow: hidden;
}
.day .n { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.out { opacity: 0.4; }
.day.fw { background: var(--fertile-soft); }
.day.fw::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--fertile); }
.day.pms::before { content: ""; position: absolute; left: 7px; right: 7px; top: 4px; height: 3px; border-radius: 2px; background: var(--pms); }
.day.perp { background: repeating-linear-gradient(135deg, var(--period-soft) 0 5px, transparent 5px 10px); border: 1px dashed var(--period); color: var(--ink); }
.day.per { background: var(--period); border-color: var(--period); color: var(--on-period); }
.day.ov .n { background: var(--ovul); color: var(--on-ovul); font-weight: 700; }
.day.ovp .n { box-shadow: inset 0 0 0 2px var(--ovul); font-weight: 600; }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day.today .n { font-weight: 700; }
.day.sel { outline: 3px solid color-mix(in srgb, var(--focus) 60%, transparent); outline-offset: 1px; }
.day .dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); }
.day.per .dot { background: var(--on-period); }
.day .react { position: absolute; top: 6px; left: 6px; width: 7px; height: 7px; background: var(--danger); border-radius: 1px; }
.day.per .react { background: var(--on-period); }

.legend h2 { font-size: 18px; }
.lg { display: grid; gap: 12px 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.lg-item { display: flex; gap: 12px; align-items: center; min-width: 0; }
.lg-item .day { width: 46px; flex: none; cursor: default; }
.lg-item b { font-weight: 500; display: block; }
.lg-item span.d { font-size: 13px; color: var(--muted); }

.daypanel h2 { font: 600 22px/1.15 var(--font-display); }
.dl { display: grid; gap: 8px; margin: 0; }
.dl > div { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 4px 12px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.dl dt { color: var(--muted); font-size: 13px; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 460px) { .dl > div { grid-template-columns: minmax(0, 1fr); } }
.who-note { font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--fertile-soft); border: 1px solid var(--fertile); }

/* ---------- diary ---------- */
.datenav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.datenav h2 { font: 600 clamp(20px, 4.4vw, 26px)/1.15 var(--font-display); flex: 1 1 200px; min-width: 0; }
.group { display: grid; gap: 16px; }
.group > h3 { font: 500 11px var(--font-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 8px; }
.fhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flabel { font-weight: 500; }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.sc { min-width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-variant-numeric: tabular-nums; }
.sc.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.addopt { display: flex; gap: 6px; max-width: 320px; }
.addopt .inp { min-height: 36px; }

/* ---------- allergens ---------- */
.al-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.al-top h1 { font: 600 clamp(26px, 5vw, 34px)/1.1 var(--font-display); letter-spacing: -0.02em; }
.al-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.acard { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; border-left-width: 6px; }
.acard.s1 { border-left-color: var(--sev1); }
.acard.s2 { border-left-color: var(--sev2); }
.acard.s3 { border-left-color: var(--sev3); }
.acard.s4 { border-left-color: var(--sev4); }
.acard h3 { font: 600 20px/1.2 var(--font-display); overflow-wrap: anywhere; }
.acard .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sev { flex: none; padding: 2px 9px; border-radius: 6px; font: 600 11px/1.6 var(--font-mono); letter-spacing: 0.03em; color: var(--on-sev); text-transform: uppercase; }
.sev1 { background: var(--sev1); }
.sev2 { background: var(--sev2); }
.sev3 { background: var(--sev3); }
.sev4 { background: var(--sev4); }

<script>
var CycleEngine = (function () {
  'use strict';
  var DAY = 86400000;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function toNum(s) { var p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY); }
  function fromNum(n) { var t = new Date(n * DAY); return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
  function dayNum(y, m, d) { return Math.round(Date.UTC(y, m, d) / DAY); }
  function todayStr() { var t = new Date(); return iso(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  var DEFAULTS = {
    cycleLen: 28,
    periodLen: 5,
    ovMode: 'luteal',      // 'luteal': от конца цикла; 'day': конкретный день цикла
    lutealLen: 14,
    ovDay: 14,
    fertileBefore: 5,
    fertileAfter: 1,
    pmsDays: 5,
    autoLen: false,
    recalc: true
  };

  function cfgOf(c) { return Object.assign({}, DEFAULTS, c || {}); }

  function sortedStarts(list) {
    var seen = {}, out = [];
    (list || []).forEach(function (s) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(s) && !seen[s]) { seen[s] = 1; out.push(s); }
    });
    return out.sort();
  }

  function effLenInfo(cfg, starts) {
    if (cfg.autoLen && starts.length >= 3) {
      var ls = [];
      for (var i = 1; i < starts.length; i++) {
        var l = toNum(starts[i]) - toNum(starts[i - 1]);
        if (l >= 15 && l <= 60) ls.push(l);
      }
      ls = ls.slice(-6);
      if (ls.length >= 2) {
        var sum = ls.reduce(function (a, b) { return a + b; }, 0);
        return { len: Math.round(sum / ls.length), auto: true };
      }
    }
    return { len: cfg.cycleLen, auto: false };
  }

  function lutealEff(cfg, base) {
    return cfg.ovMode === 'day' ? Math.max(1, base - cfg.ovDay) : cfg.lutealLen;
  }

  // s: номер дня начала цикла; L: длина; ovA / eA: фактические овуляция и конец месячных (номера дней) или null
  function mk(cfg, s, L, ovA, eA, kind) {
    L = Math.max(2, Math.round(L));
    var periodLen = eA != null ? clamp(eA - s + 1, 1, L) : clamp(cfg.periodLen, 1, L);
    var hi = L - 1;
    var od = cfg.ovMode === 'day' ? cfg.ovDay : L - cfg.lutealLen;
    var lo = Math.max(1, Math.min(periodLen + 1, hi));
    od = clamp(Math.round(od), lo, hi);
    var ovKind = 'p';
    if (ovA != null) { od = clamp(ovA - s + 1, 1, hi); ovKind = 'a'; }
    var ovN = s + od - 1;
    var fwStart = Math.max(s, ovN - cfg.fertileBefore);
    var fwEnd = Math.min(s + L - 1, ovN + cfg.fertileAfter);
    var pmsFrom = cfg.pmsDays > 0 ? Math.max(od + 1, L - cfg.pmsDays + 1) : L + 1;
    return { start: s, len: L, periodLen: periodLen, od: od, ovKind: ovKind, ovN: ovN,
             fwStart: fwStart, fwEnd: fwEnd, pmsFrom: pmsFrom, kind: kind };
  }

  function buildCycles(cfgIn, startsIso, ovul, ends, horizon) {
    var cfg = cfgOf(cfgIn);
    var list = sortedStarts(startsIso);
    var out = [];
    if (!list.length) return out;
    ovul = ovul || {}; ends = ends || {};
    var base = effLenInfo(cfg, list).len;
    var lut = lutealEff(cfg, base);
    var nums = list.map(toNum);
    for (var i = 0; i < nums.length; i++) {
      var s = nums[i];
      var key = list[i];
      var ovA = ovul[key] ? toNum(ovul[key]) : null;
      var eA = ends[key] ? toNum(ends[key]) : null;
      var len, kind;
      if (i + 1 < nums.length) { len = nums[i + 1] - s; kind = 'past'; }
      else {
        kind = 'current';
        len = base;
        if (ovA != null && cfg.recalc) len = (ovA - s + 1) + lut;
      }
      out.push(mk(cfg, s, len, ovA, eA, kind));
    }
    var last = out[out.length - 1];
    var next = last.start + last.len;
    var guard = 0;
    while (next <= horizon && guard++ < 60) {
      out.push(mk(cfg, next, base, null, null, 'pred'));
      next += Math.max(2, base);
    }
    return out;
  }

  function infoAt(cycles, n, t) {
    for (var i = cycles.length - 1; i >= 0; i--) {
      var c = cycles[i];
      if (n >= c.start) {
        if (n >= c.start + c.len) return null;
        var d = n - c.start + 1;
        var ph = d <= c.periodLen ? 'M' : (d < c.od ? 'F' : (d === c.od ? 'O' : 'L'));
        return {
          cycleDay: d,
          phase: ph,
          period: d <= c.periodLen ? ((c.kind === 'pred' || n > t) ? 'p' : 'a') : null,
          ov: d === c.od ? c.ovKind : null,
          fw: n >= c.fwStart && n <= c.fwEnd,
          pms: ph === 'L' && d >= c.pmsFrom,
          kind: c.kind, start: c.start, len: c.len
        };
      }
    }
    return null;
  }

  // Состояние последнего реального цикла: сколько до следующих месячных и есть ли задержка
  function status(cycles, t) {
    var cur = null;
    for (var i = 0; i < cycles.length; i++) if (cycles[i].kind !== 'pred') cur = cycles[i];
    if (!cur || t < cur.start) return null;
    var nextStart = cur.start + cur.len;
    return { cycleStart: cur.start, len: cur.len, nextStart: nextStart,
             daysToNext: nextStart - t, lateDays: t > nextStart ? t - nextStart : 0 };
  }

  // Первый отрезок подряд идущих дней, где у getInfo(n)[key] истинно: идущий сейчас или ближайший будущий
  function firstRun(getInfo, key, t, span) {
    function f(n) { var i = getInfo(n); return !!(i && i[key]); }
    var s, e;
    if (f(t)) {
      s = t; while (f(s - 1) && t - s < 60) s--;
      e = t; while (f(e + 1) && e - t < 60) e++;
      return { start: s, end: e, now: true };
    }
    for (var n = t + 1; n <= t + span; n++) {
      if (f(n)) {
        e = n; while (f(e + 1) && e - n < 60) e++;
        return { start: n, end: e, now: false };
      }
    }
    return null;
  }

  // Полоса текущего цикла из последовательных дней: [{ph, len, from}]
  function ribbon(getInfo, t) {
    var cur = getInfo(t);
    if (!cur || !cur.phase || !cur.cycleDay) return null;
    var start = t - (cur.cycleDay - 1);
    var segs = [];
    for (var n = start; n < start + 90; n++) {
      var i = getInfo(n);
      if (!i || !i.phase) break;
      if (n > start && i.cycleDay === 1) break;
      var last = segs[segs.length - 1];
      if (last && last.ph === i.phase) last.len++;
      else segs.push({ ph: i.phase, len: 1, from: n });
    }
    var total = segs.reduce(function (a, s) { return a + s.len; }, 0);
    var fw = null;
    for (var k = start; k < start + total; k++) {
      var q = getInfo(k);
      if (q && q.fw) { if (!fw) fw = { from: k, to: k }; else fw.to = k; }
    }
    return { start: start, total: total, day: cur.cycleDay, segs: segs, fw: fw };
  }

  // Параметры цикла в днях цикла, без привязки к датам (для подсказки в настройках)
  function plan(cfgIn, startsIso) {
    var cfg = cfgOf(cfgIn);
    var info = effLenInfo(cfg, sortedStarts(startsIso));
    var c = mk(cfg, 0, info.len, null, null, 'pred');
    return {
      len: c.len, periodLen: c.periodLen, ovDay: c.od, luteal: c.len - c.od,
      fwFrom: c.fwStart + 1, fwTo: c.fwEnd + 1,
      pmsFrom: c.pmsFrom <= c.len ? c.pmsFrom : null, auto: info.auto
    };
  }

  return {
    DEFAULTS: DEFAULTS, cfgOf: cfgOf, sortedStarts: sortedStarts,
    iso: iso, toNum: toNum, fromNum: fromNum, dayNum: dayNum, todayStr: todayStr,
    buildCycles: buildCycles, infoAt: infoAt, status: status,
    firstRun: firstRun, ribbon: ribbon, plan: plan
  };
})();
if (typeof module !== 'undefined') module.exports = CycleEngine;
</script>

    h('p', { class: 'lead', text: 'Создайте код и отправьте его партнёру. Он вводит его у себя в приложении. Код одноразовый.' }));
  var out = h('div', { class: 'stack', style: 'gap:8px' });
  box.appendChild(h('div', { class: 'btn-row' }, btn('Создать код', function () {
    Backend.createInvite().then(function (code) {
      out.textContent = '';
      out.appendChild(h('div', { class: 'result' }, h('div', { class: 'eyebrow', text: 'Код приглашения' }), h('b', { class: 'nums', style: 'font-size:22px;letter-spacing:.1em', text: code })));
      toast('Код создан', false);
    }, function (e) { toast('Не получилось создать код: ' + errMsg(e), true); });
  }, 'btn btn-primary')));
  box.appendChild(out);
  return box;
}
function joinCard() {
  var inp = h('input', { id: 'join-code', type: 'text', class: 'inp', autocomplete: 'off', autocapitalize: 'characters', placeholder: 'Например, K7QX2M9B', 'aria-label': 'Код приглашения', oninput: function () { S.joinCode = this.value; } });
  return h('section', { class: 'card' }, h('h2', { text: 'Подключиться к партнёрше' }),
    h('p', { class: 'lead', text: 'Введите код, который она создала в своих настройках.' }),
    h('div', { class: 'btn-row', style: 'align-items:center' }, inp, btn('Подключить', function () {
      Backend.acceptInvite(S.joinCode || '').then(function () {
        S.joinCode = ''; toast('Готово, пара создана', false); render(true);
      }, function (e) { toast(errMsg(e), true); });
    }, 'btn btn-primary')));
}

(function bootEvents() {
  var r = (location.hash || '').slice(1);
  if (ROUTES.indexOf(r) >= 0) S.route = r;
  window.addEventListener('hashchange', function () {
    var x = (location.hash || '').slice(1);
    if (ROUTES.indexOf(x) >= 0 && x !== S.route) { flushAll(); S.route = x; render(true); }
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName) && t.type !== 'button' && t.type !== 'checkbox' && t.type !== 'file') S.typing = true;
  });
  document.addEventListener('focusout', function () { S.typing = false; setTimeout(flushDirty, 350); });
  document.addEventListener('pointerdown', function () { S.pointer = true; }, true);
  var up = function () { S.pointer = false; setTimeout(flushDirty, 80); };
  document.addEventListener('pointerup', up, true);
  document.addEventListener('pointercancel', up, true);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.lightbox) { S.lightbox = null; render(true); } else if (S.sheet) closeSheet();
  });
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushAll();
    else { render(); maybeSync(); }
  });
})();

try {

} catch (e) {}
